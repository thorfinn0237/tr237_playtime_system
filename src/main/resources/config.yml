  top-header: "&8&m------&r &bTop %limit% Playtime Leaderboard &8&m------"
  top-entry: "&b#%rank% &e%player% &8- &f%time%"
  top-empty: "&7No playtime records available yet."
  top-footer: "&8&m----------------------------------------"

  admin-set: "&aSet &e%player%&a's playtime to &b%time%&a."
  admin-add: "&aAdded &b%amount% &ato &e%player%&a's playtime. New total: &b%time%&a."

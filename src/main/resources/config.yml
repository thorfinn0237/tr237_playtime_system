  invalid-duration: "&cInvalid duration format! Examples: &e1d2h30m&c, &e45m&c, &e2h15s"
  usage: "&cUsage: &e/playtime [player | top | set <player> <duration> | add <player> <duration> | remove <player> <duration> | reload]"

  self-playtime: "&7Your total playtime: &b%time%"
